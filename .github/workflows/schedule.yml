name: Daily Game News Scraper

#on:
#  schedule:
#    - cron: '17 1 * * 1-5'   # 평일 10:17 KST
  workflow_dispatch:

concurrency:
  group: daily-game-news-scraper
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Print runner time before run
        run: |
          echo "UTC now:"
          date -u
          echo "KST now:"
          TZ=Asia/Seoul date

      - name: Run scraper (retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 12
          max_attempts: 3
          retry_wait_seconds: 20
          command: python main.py
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Print runner time after run
        if: always()
        run: |
          echo "UTC end:"
          date -u
          echo "KST end:"
          TZ=Asia/Seoul date
